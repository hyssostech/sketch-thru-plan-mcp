name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [ '22', '24' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Builds every workspace (tsc --build follows the root project references),
      # then runs the tests. In CI vitest never writes a snapshot, so a contract
      # re-pin without a reviewed snapshot update fails here.
      - name: Build and test
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
