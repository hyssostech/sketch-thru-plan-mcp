name: Contract drift

# The tools are generated from a PINNED copy of the STP OpenRPC contract
# (packages/contract-tools/contract). This reports when the published contract
# (hyssostech/sketch-thru-plan-sdk-js, json-api/sketch-thru-plan-api.json) has
# moved past the pin, so a re-pin is a reviewed change rather than a surprise.
# Credential-free: the contract repo is public.

on:
  schedule:
    - cron: '41 6 * * 1'   # Mondays 06:41 UTC, after STP's OpenRPC surface gate (06:30)
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/update-contract.mjs'
      - 'packages/contract-tools/contract/**'
      - '.github/workflows/contract-drift.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Compare the pinned contract with the published one
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-contract.mjs --check
